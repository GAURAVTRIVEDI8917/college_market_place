services:
  - type: web
    name: campusmart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: CAMPUSMART_SECRET_KEY
        generateValue: true
      - key: CAMPUSMART_ADMIN_EMAIL
        value: gtbhai501@gmail.com
