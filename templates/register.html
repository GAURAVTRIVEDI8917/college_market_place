<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CampusMart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8f1ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #ccd5e5;
        }

        h1 {
            text-align: center;
            color: #174ea6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #174ea6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #103a80;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #174ea6;
            text-decoration: none;
        }

        .message {
            color: #c0392b;
            text-align: center;
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CampusMart</h1>

        <p class="subtitle">Create Your Student Account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

            <input
                type="text"
                name="name"
                placeholder="Enter Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter Email Address"
                required
            >

            <input
                type="tel"
                name="phone"
                placeholder="WhatsApp number with country code (optional)"
                pattern="\+?[0-9\s()-]{8,20}"
                title="Enter your number with country code, e.g. +919876543210"
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p class="bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <p class="bottom">
            <a href="{{ url_for('home') }}">Back to Home</a>
        </p>

    </div>

    <script src="{{ url_for('static', filename='website-share.js') }}" defer></script>
</body>
</html>
